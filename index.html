    <!-- Single Page Apps for GitHub Pages -->
    <!-- The GitHub Pages SPA redirect shim used to sit here. It was dead twice
         over: Cloudflare Workers serves every route as a real URL so nothing
         ever arrives as `?/path`, and the production CSP (`script-src 'self'`)
         refused to execute it anyway. -->

    <!-- No preconnect hints to third parties, deliberately. RSS feeds are
         fetched by this site's own Worker (/api/v1/feed), so the browser
         talks to nobody else. The hints that used to live here fired a DNS
         lookup for two CORS proxies on EVERY page view, whether or not a
         feed was ever read - leaking the reader's interest before they had
         done anything. -->
  </head>
  <body>
    <!-- This message must never tell a reader to weaken their browser's
         security posture. It previously advised using Tor Browser "with
         JavaScript enabled", while the site's own Security Center tells
         readers in China to use Tor exclusively and consider Tails. Tor's
         Safest level disables JavaScript because JavaScript is the main
         deanonymisation and fingerprinting vector, so that advice asked the
         most at-risk readers to give up their strongest protection in order
         to read us.

         This is a stopgap. The real fix is to pre-render content so the site
         works without JavaScript at all — see docs/MODERNIZATION.md. -->
    <noscript>
      <div style="padding: 12px 20px; background: #111820; color: #e2e8f0; border-bottom: 1px solid #1c2a35; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6;">
        <strong style="color: #4afa82;">Reading without JavaScript.</strong>
        The pages below are pre-rendered, so the records, profiles and timeline are all here.
        Search, filters and tabbed sections need JavaScript and will not respond.
        <strong>Intelligence Feeds</strong> is fetched live and will stay empty — it says
        &ldquo;Loading&hellip;&rdquo; but nothing is loading. For that and for the raw data,
        the read-only API returns plain JSON:
        <a href="/api/v1/" style="color: #4afa82;">/api/v1/</a>.
        <strong>If you are on Tor Browser's Safer or Safest setting, stay there.</strong>
        Do not lower your security level to read this site.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- The service worker is registered from src/main.tsx, not here. As an
         inline script the CSP refused to execute it, so sw.js never

  </body>
