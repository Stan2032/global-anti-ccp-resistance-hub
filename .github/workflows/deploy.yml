name: Deploy to Cloudflare Workers

# The site is served from Cloudflare Workers, which is also what applies the
# security headers in public/_headers (CSP, HSTS, COOP/CORP, Referrer-Policy).
# This replaced an older GitHub Pages deploy that published an unhardened,
# separately-stale copy of the same site — see docs/MODERNIZATION.md.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it under Settings > Secrets and variables > Actions to enable automatic deploys." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        run: npm run build

      - name: Deploy with Wrangler
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
